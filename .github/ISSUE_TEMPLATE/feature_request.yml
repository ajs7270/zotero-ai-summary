name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or workflow gap should this solve?
      placeholder: I want to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Zotero plugin
        - summary skill
        - pinpoint-lesson skill
        - Installer
        - Documentation
        - Release workflow
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, examples, or related papers/workflows.
